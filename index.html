<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 웰니스 판 · 파일럿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  :root{
    --paper:#F1ECE0; --card:#FBF8F0; --ink:#2B3A32; --ink-soft:#5C6B60;
    --line:#DCD3BE; --sage:#6E8B74; --sage-soft:#E1E9DF;
    --ochre:#B9862F; --ochre-soft:#F3E6C9; --rose:#C4767E;
    --shadow:0 2px 10px rgba(43,58,50,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #app{max-width:760px;margin:0 auto;padding:28px 16px 80px;}
  .brand h1{font-family:'Gowun Batang',serif;font-size:26px;margin:0 0 4px;letter-spacing:-0.5px;}
  .brand .tag{display:inline-block;font-size:11px;color:var(--sage);border:1px solid var(--sage);border-radius:999px;padding:2px 10px;font-weight:600;margin-left:8px;vertical-align:middle;}
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);}
  .card h2{font-family:'Gowun Batang',serif;font-size:19px;margin:0 0 4px;}
  .card .desc{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:12px;}
  input[type=text],textarea,select{
    font-family:'Noto Sans KR',sans-serif;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{min-height:70px;resize:vertical;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > label{flex:1;min-width:180px;}
  .btn{
    font-family:'Noto Sans KR',sans-serif;border:none;border-radius:8px;padding:11px 20px;
    font-size:14px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;
  }
  .btn:hover{opacity:.88;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.secondary{background:var(--sage-soft);color:var(--ink);}
  .result{
    margin-top:16px;background:#fff;border:1px dashed var(--line);border-radius:10px;
    padding:16px 18px;font-size:14px;line-height:1.75;white-space:pre-wrap;
  }
  .result .rec-title{font-family:'Gowun Batang',serif;font-size:16px;font-weight:700;color:var(--sage);margin-bottom:8px;white-space:normal;}
  .loading{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;margin-top:14px;}
  .spinner{
    width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ochre);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .club-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .club-legend span{
    background:var(--sage-soft);color:var(--sage);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;
  }
  .error{color:#B4483F;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div id="app">
  <div class="brand"><h1>AI 웰니스 판<span class="tag">파일럿</span></h1></div>
  <p class="subtitle">회원 매칭과 공통 테마 제안을 AI가 함께 만들어보는 실험 버전입니다</p>

  <div class="card">
    <h2>지금 운영 중인 동호회</h2>
    <p class="desc">이 목록을 기준으로 AI가 추천합니다. 필요하면 아래에서 수정하세요.</p>
    <textarea id="club-roster" rows="4">방송댄스 - 화·목 점심 - 신나는 음악으로 활력을 되찾는 시간
줌바댄스 - 화·목 저녁 - 리듬 속에서 스트레스를 날리는 시간
필라테스 - 월·수 점심 - 코어와 자세를 함께 다지는 시간
요가 - 화·목 점심 - 호흡과 정렬에 집중하는 시간
체형교정 트레이닝 - 월·수 저녁 - 바른 자세를 잡아가는 시간</textarea>
  </div>

  <div class="card">
    <h2>① 회원 매칭 체험</h2>
    <p class="desc">회원이 될 분의 상황을 간단히 적으면, AI가 어떤 동호회부터 시작하면 좋을지 추천해드려요</p>
    <label class="field">이름 (선택)
      <input type="text" id="m-name" placeholder="예: 김OO">
    </label>
    <div class="row">
      <label class="field">가능한 시간대
        <input type="text" id="m-time" placeholder="예: 평일 저녁만 가능">
      </label>
      <label class="field">평소 몸 상태·걱정
        <input type="text" id="m-body" placeholder="예: 허리가 약한 편">
      </label>
    </div>
    <label class="field">바라는 것 / 목표
      <textarea id="m-goal" placeholder="예: 활력을 되찾고 싶고, 사람들과 어울리는 것도 좋아해요"></textarea>
    </label>
    <button class="btn" id="match-btn" onclick="runMatch()">AI 매칭 받기</button>
    <div id="match-loading"></div>
    <div id="match-result"></div>
  </div>

  <div class="card">
    <h2>② 이달의 공통 테마 제안</h2>
    <p class="desc">서로 다른 동호회를 하나의 테마로 잇는 아이디어를 AI가 제안해드려요 (시 감상 등과 결합할 때 특히 좋아요)</p>
    <label class="field">이번 달 느낌 / 계절 (선택)
      <input type="text" id="theme-hint" placeholder="예: 초가을, 새로운 시작">
    </label>
    <button class="btn secondary" id="theme-btn" onclick="runTheme()">이달의 테마 제안받기</button>
    <div id="theme-loading"></div>
    <div id="theme-result"></div>
  </div>
</div>

<script>
async function callClaude(systemPrompt, userPrompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }]
    })
  });
  if(!response.ok){ throw new Error("API 호출에 실패했습니다"); }
  const data = await response.json();
  const textBlock = data.content.find(b => b.type === "text");
  return textBlock ? textBlock.text : "";
}

async function runMatch(){
  const btn = document.getElementById('match-btn');
  const loadingEl = document.getElementById('match-loading');
  const resultEl = document.getElementById('match-result');
  const name = document.getElementById('m-name').value.trim() || '회원님';
  const time = document.getElementById('m-time').value.trim();
  const body = document.getElementById('m-body').value.trim();
  const goal = document.getElementById('m-goal').value.trim();
  const roster = document.getElementById('club-roster').value.trim();

  if(!goal){ resultEl.innerHTML = '<div class="error">바라는 것/목표를 조금이라도 적어주세요.</div>'; return; }

  btn.disabled = true;
  loadingEl.innerHTML = '<div class="loading"><div class="spinner"></div>추천을 준비하고 있어요...</div>';
  resultEl.innerHTML = '';

  const system = `당신은 몸과 마음을 함께 돌보는 웰니스 커뮤니티의 다정한 운영 도우미입니다. 아래 동호회 목록 중에서만 추천하며, 근거 없는 의학적 조언은 하지 않습니다. 답변은 한국어로, 3~5문장 정도로 따뜻하고 간결하게 작성하세요. 형식: 첫 줄에 "추천: [동호회명]"을 쓰고, 그 다음 줄부터 이유와 시작 팁을 자연스러운 문장으로 씁니다.

[운영 중인 동호회 목록]
${roster}`;

  const user = `이름: ${name}
가능한 시간대: ${time || '알 수 없음'}
평소 몸 상태·걱정: ${body || '특이사항 없음'}
바라는 것/목표: ${goal}

이 사람에게 가장 잘 맞는 동호회 하나를 추천해주세요.`;

  try{
    const text = await callClaude(system, user);
    resultEl.innerHTML = `<div class="result">${text.replace(/</g,'&lt;')}</div>`;
  }catch(e){
    resultEl.innerHTML = `<div class="error">추천을 가져오지 못했어요. 잠시 후 다시 시도해주세요.</div>`;
  }finally{
    loadingEl.innerHTML = '';
    btn.disabled = false;
  }
}

async function runTheme(){
  const btn = document.getElementById('theme-btn');
  const loadingEl = document.getElementById('theme-loading');
  const resultEl = document.getElementById('theme-result');
  const hint = document.getElementById('theme-hint').value.trim();
  const roster = document.getElementById('club-roster').value.trim();

  btn.disabled = true;
  loadingEl.innerHTML = '<div class="loading"><div class="spinner"></div>테마를 구상하고 있어요...</div>';
  resultEl.innerHTML = '';

  const system = `당신은 서로 다른 동호회들을 하나의 정서로 이어주는 콘텐츠 기획자입니다. 시 한 구절, 짧은 문장, 혹은 하나의 정서적 테마를 제안하고, 그 테마를 각 동호회가 자기 방식대로 어떻게 풀어낼 수 있을지 한 줄씩 제안하세요. 저작권이 있는 기존 시나 노래 가사를 그대로 인용하지 말고, 직접 짧은 문장을 새로 지어 제안하세요. 한국어로, 형식은 다음과 같이 하세요:

[이달의 테마]
(한 문장)

[동호회별 적용 아이디어]
- 동호회명: 아이디어 한 줄`;

  const user = `아래 동호회들을 위한 이달의 공통 테마를 제안해주세요.
${hint ? '이번 달 분위기/계절: ' + hint : ''}

[운영 중인 동호회 목록]
${roster}`;

  try{
    const text = await callClaude(system, user);
    resultEl.innerHTML = `<div class="result">${text.replace(/</g,'&lt;')}</div>`;
  }catch(e){
    resultEl.innerHTML = `<div class="error">테마 제안을 가져오지 못했어요. 잠시 후 다시 시도해주세요.</div>`;
  }finally{
    loadingEl.innerHTML = '';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
